name: Lesson 01 - Hello GitHub Actions
on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: print git version
        run: git --version
      - name: Say hello
        run: echo "Hello, GitHub Actions!"
      - name: Show runner information
        run: |
          echo "OS:"
          uname -s
          echo "Current directory:"
          pwd
          echo "Current branch:"
          echo "$GITHUB_REF_NAME"
